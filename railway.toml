[build]
builder = "nixpacks"
buildCommand = "composer install && npm install && npm run build"

 [deploy]
startCommand="php artisan db:seed --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host 0.0.0.0 --port \$PORT"
# healthcheckPath = "/"
# healthcheckTimeout = 100
# restartPolicyType = "on_failure"

[phases.setup]
nixPkgs = ["php81", "nodejs-18_x", "npm-8_x"]
